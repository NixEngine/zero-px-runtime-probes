# Generated from the two independent probe sources; do not edit generated content.
# probe-wsl.ps1 sha256: 3100ea59ae077c3a01da3f45e44b38cbb334589f7b0392afd5abd929ae7ca5d3
# probe-linux.sh sha256: 057f20690e7da5336de0f893dec14792023aee92d20d86e5b4ef46d42bf0976c
name: Windows WSL2 Linux Compose feasibility
'on':
  workflow_dispatch: {}
permissions: {}
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Materialize reviewed PowerShell source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windows64 = ''
          $source = [Convert]::FromBase64String($windows64)
          $actual = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($source)).ToLowerInvariant()
          if ($actual -ne '3100ea59ae077c3a01da3f45e44b38cbb334589f7b0392afd5abd929ae7ca5d3') { throw 'Embedded PowerShell source binding mismatch.' }
          $sourcePath = Join-Path $env:RUNNER_TEMP 'wsl2-compose-reviewed.ps1'
          if (Test-Path -LiteralPath $sourcePath) { throw 'Refusing to replace a pre-existing staged source.' }
          [IO.File]::WriteAllBytes($sourcePath,$source)
      - name: Independent WSL2 plus Linux Docker Compose smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $linux64 = ''
          $sourcePath = Join-Path $env:RUNNER_TEMP 'wsl2-compose-reviewed.ps1'
          $actual = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '3100ea59ae077c3a01da3f45e44b38cbb334589f7b0392afd5abd929ae7ca5d3') { throw 'Staged PowerShell source binding mismatch.' }
          & $sourcePath -LinuxSourceBase64 $linux64 -LinuxSourceSha256 '057f20690e7da5336de0f893dec14792023aee92d20d86e5b4ef46d42bf0976c'
